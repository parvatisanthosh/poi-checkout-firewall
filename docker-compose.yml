services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: poi
      POSTGRES_PASSWORD: poi
      POSTGRES_DB: poi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - poi-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poi -d poi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  poi-pg:
