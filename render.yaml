  #         sync: false

  #   # --- Nightly calibration (task Q10): calibrate.crc once at CRC_ALPHA, then exit. With too little
  #   # data it logs "need more calibration data" and keeps the previous calibration active.
  #   - type: cron
  #     name: poi-calibrate
