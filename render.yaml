  #       - key: CRC_BENIGN_VOID_QUANTILE
  #         value: "0.99"

  # --- Optional separate worker (background workers are a paid Render plan). To use it, set
  # WORKER_INLINE=false on poi-api and uncomment. Both share Redis: jobs via BullMQ, events via
  # the Socket.IO redis adapter.
  # - type: worker
  #   name: poi-worker
  #   runtime: node
  #   plan: starter
  #   buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @poi/api build
  #   startCommand: node apps/api/dist/worker.js
  #   envVars:
  #     - fromGroup: poi-shared   # or copy poi-api's env vars

  - type: keyvalue
    name: poi-redis
    plan: free
    maxmemoryPolicy: noeviction # BullMQ requires noeviction
    ipAllowList: [] # internal connections only

  # --- Teammate's services (placeholders; commands are owned by apps/bazaar and apps/web) ---
  - type: web
    name: poi-bazaar
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @poi/bazaar build
    startCommand: node apps/bazaar/dist/server.js # listens on Render's PORT
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: poi-web
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @poi/web build
    startCommand: pnpm --filter @poi/web start # next start honours Render's PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # NEXT_PUBLIC_* are inlined at build time: redeploy after changing them.
      - key: NEXT_PUBLIC_POI_API_URL
        sync: false # https://poi-api.onrender.com
      - key: NEXT_PUBLIC_BAZAAR_URL
        sync: false # https://poi-bazaar.onrender.com
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false # same sandbox client id as the API (public)
      - key: BAZAAR_URL
        sync: false # server-side, for the agent route
      # The shopping agent runs in the web app's /api/agent/run route.
      - key: AGENT_MODELS
        value: google:gemini-flash-lite-latest,groq:openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: poi-db
    plan: free
    databaseName: poi
    user: poi
    # pgvector: the first migration runs CREATE EXTENSION vector (Render Postgres ships it).
