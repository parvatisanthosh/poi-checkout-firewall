  #         value: "22"
  #       - key: DATABASE_URL
  #         fromDatabase:
  #           name: poi-db
  #           property: connectionString
  #       - key: REDIS_URL
  #         fromService:
  #           type: keyvalue
  #           name: poi-redis
  #           property: connectionString
  #       - key: ARENA_ENGINE
  #         value: real
  #       # Free-tier LLM keys: keep trial parallelism low.
  #       - key: ARENA_CONCURRENCY
  #         value: "2"
