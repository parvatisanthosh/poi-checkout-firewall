# Render Blueprint (P12). One blueprint for the whole demo.
# Secrets are `sync: false`: Render asks for them on first deploy (Dashboard > Blueprint).
# Free instances sleep after inactivity: open the URLs ~2 minutes before recording/judging.
services:
  # --- POI API (+ in-process verify worker, WORKER_INLINE=true) -------------------------
  - type: web
    name: poi-api
    runtime: node
    plan: free
    region: oregon
    # --prod=false: prisma/tsx are devDependencies and NODE_ENV=production would skip them.
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @poi/api build && pnpm db:deploy && pnpm db:seed &&
      pnpm --filter @poi/api terms:ingest
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: poi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: poi-redis
          property: connectionString
      - key: WORKER_INLINE
        value: "true"
      - key: VERIFY_CONCURRENCY
        value: "4"
      - key: LOG_LEVEL
        value: info
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: POI_SIGNING_JWK
        sync: false
      - key: WEB_ORIGIN
        sync: false # e.g. https://poi-web.onrender.com
      - key: BAZAAR_URL
        sync: false # e.g. https://poi-bazaar.onrender.com
      - key: COMPILER_MODEL
        value: google:gemini-flash-lite-latest
      - key: JUDGE_MODEL
        value: google:gemini-flash-lite-latest
      - key: EMBEDDING_MODEL
        value: google:gemini-embedding-001
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # --- Layer 2 (docs/CONTRACTS-L2.md 4.8) ---
      # Live authorizations also run immune memory + the conformal gate (they only tighten).
      - key: LIVE_LAYER2
        value: "true"
      # Arena + immune jobs run in this process ("false" once poi-arena-worker below is deployed).
      - key: ARENA_WORKERS_INLINE
        value: "true"
      - key: ARENA_ENGINE
        value: real
      # Free-tier LLM keys: one trial at a time, and pace requests per provider (429s are waited out).
      - key: ARENA_CONCURRENCY
        value: "1"
      - key: ARENA_MAX_USD
        value: "15"
      - key: ARENA_ATTACKER_MODEL
        value: groq:openai/gpt-oss-120b
      - key: LLM_RPM_GOOGLE
        value: "10"
      - key: LLM_RPM_GROQ
        value: "25"
      - key: ARENA_AGENT_MODEL
        value: google:gemini-flash-lite-latest
      - key: IMMUNE_BENIGN_SET
        value: bench/evolved/benign-40.json
      - key: CRC_ALPHA
        value: "0.05"

  # --- Paid on Render (starter plan), so commented out for the free hackathon deploy: poi-api runs
  # the arena + immune workers in-process (ARENA_WORKERS_INLINE=true) and calibration is run on demand
  # (POST /api/calibration/run). Uncomment both blocks to split them out.
  #   # --- Layer 2 arena worker (task Q10): arena.generation / arena.trial / immune.mint /
  #   # immune.promote. Same build as the API; no Layer 1 verify jobs, so a long arena run never
  #   # slows a checkout. Background workers are a paid Render plan.
