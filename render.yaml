  #         value: "15"
  #       - key: ARENA_ATTACKER_MODEL
  #         value: groq:openai/gpt-oss-120b
  #       - key: ARENA_HELDOUT_ATTACKER_MODEL
  #         value: groq:qwen/qwen3.8-27b
  #       - key: ARENA_AGENT_MODEL
  #         value: google:gemini-flash-lite-latest
  #       - key: IMMUNE_BENIGN_SET
  #         value: bench/evolved/benign-40.json
  #       - key: COMPILER_MODEL
  #         value: google:gemini-flash-lite-latest
  #       - key: JUDGE_MODEL
  #         value: google:gemini-flash-lite-latest
  #       - key: EMBEDDING_MODEL
  #         value: google:gemini-embedding-001
  #       - key: POI_SIGNING_JWK
  #         sync: false # the same key as poi-api (antibodies and evidence are signed with it)
